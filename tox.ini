[tox]
envlist = flake8, py310, py311, py312, py313, py314, pypy3, coverage

[testenv]
passenv = *
changedir =
    tests

commands =
    py.test

deps =
    pytest>=6.1.1,<8.2.0
    pytest-reraise
    coverage
    pytest-cov
    cython
    pytest_asyncio

[testenv:flake8]
deps =
    flake8>=4.0
commands = flake8 .
changedir = .

[testenv:coverage]
commands =
    py.test --cov=thriftpy2

[coverage:run]
branch = True
parallel = True
concurrency =
    multiprocessing
    thread
